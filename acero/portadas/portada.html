<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Bebas;src:url(bebas.woff2)}@font-face{font-family:Mont;src:url(mont800.woff2);font-weight:800}@font-face{font-family:Mont;src:url(mont900.woff2);font-weight:900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:radial-gradient(ellipse at 70% 20%,#0f3550 0%,#0a1e30 45%,#06121e 100%);color:#fff;font-family:Mont;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px}
.logo{position:absolute;top:28px;left:52px;height:104px}
.curso{position:absolute;top:66px;right:72px;font-weight:800;font-size:15px;letter-spacing:2.5px;color:#9fb3c2;text-transform:uppercase}
.box{position:absolute;left:72px;right:100px;top:168px}
.cur{font-weight:900;font-size:26px;letter-spacing:.5px;color:#fff;margin-bottom:14px;opacity:.92}
.mod{font-weight:800;font-size:20px;letter-spacing:4px;color:#E8893A;text-transform:uppercase}
.num{font-family:Bebas;font-size:128px;line-height:.9;color:#E8893A;margin-top:14px}
.t{font-family:Bebas;font-size:var(--fs);line-height:1.0;margin-top:6px;letter-spacing:1px}
.bar{position:absolute;left:72px;bottom:70px;width:120px;height:6px;background:#E8893A;border-radius:3px}
.foot{position:absolute;left:216px;bottom:63px;font-weight:800;font-size:16px;letter-spacing:2px;color:#9fb3c2;text-transform:uppercase}
</style></head><body><div class="grid"></div>
<img class="logo" src="logo-claro.png">
<div class="box"><div class="cur" id="cur"></div><div class="mod" id="mod"></div><div class="num" id="num"></div><div class="t" id="t"></div></div>
<div class="bar"></div><div class="foot" id="foot">Ing. Gabriel Pantoja · Lección en video</div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('mod').textContent=q.get('m');document.getElementById('cur').textContent=q.get('c');
document.getElementById('num').textContent='LECCIÓN '+q.get('n');
if(q.get('i'))document.getElementById('foot').textContent=q.get('i')+' · Lección en video';const t=q.get('t');document.getElementById('t').textContent=t;
document.querySelector('.t').style.setProperty('--fs',(t.length>48?68:t.length>34?80:92)+'px');
</script></body></html>

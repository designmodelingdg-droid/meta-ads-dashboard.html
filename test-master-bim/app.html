<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico BIM · Máster Internacional BIM + IA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;700;800;900&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003e5c; --navy2:#001e30; --azul:#0a5a80;
    --orange:#ca7520; --orange-d:#e8a04a; --orange-p:#f7e8cc; --crema:#fafaf7;
    --card:#fff; --ink:#333; --ink2:#5a6b7b; --line:#e5e7eb;
    --ok:#1e9e6a; --bad:#d64545; --chip-ok:#e4f6ee; --chip-bad:#fdeaea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--navy2)}
  body{font-family:'Nunito',system-ui,sans-serif;
    background:linear-gradient(135deg,var(--navy2) 0%,var(--navy) 100%);
    min-height:100vh;color:var(--ink);padding:0 14px 50px}
  h1,h2,h3,h4{font-family:'Overpass',sans-serif}
  .wrap{max-width:660px;margin:0 auto}

  header{padding:26px 0 18px;color:#fff;text-align:center}
  header .eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.16em;
    text-transform:uppercase;color:var(--orange-d);margin-bottom:9px}
  header h1{font-size:clamp(1.35rem,4.6vw,1.85rem);font-weight:900;line-height:1.2}
  header p{font-size:.9rem;color:#c3d1dc;margin-top:9px;line-height:1.55}

  .barra{height:6px;background:rgba(255,255,255,.14);border-radius:99px;overflow:hidden;margin:16px 0 6px}
  .barra i{display:block;height:100%;width:0;background:var(--orange-d);transition:width .25s}
  .cuenta{font-size:.76rem;color:#a8bccb;text-align:center;margin-bottom:16px}

  .card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.28);margin-bottom:14px}
  .grupo{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    color:var(--orange);margin-bottom:9px}
  .preg{font-size:1rem;font-weight:700;color:var(--navy);line-height:1.42;margin-bottom:14px}
  .ops{display:grid;gap:7px}
  .op{display:block;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);
    border-radius:10px;background:#fbfcfe;font:inherit;font-size:.9rem;color:var(--ink);cursor:pointer}
  .op:hover{border-color:var(--orange-d);background:#fff8ef}
  .op.sel{border-color:var(--orange);background:var(--orange-p);font-weight:700}
  .op:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

  .nav{display:flex;gap:9px;margin-top:16px}
  .btn{flex:1;padding:12px;border:0;border-radius:10px;font:inherit;font-family:'Overpass',sans-serif;
    font-weight:800;font-size:.94rem;cursor:pointer;background:var(--orange);color:#fff;text-align:center;
    text-decoration:none;display:block}
  .btn:hover{background:var(--orange-d)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.sec{background:#eef3f7;color:var(--navy)}
  .btn.sec:hover{background:#e2eaf1}

  /* ── resultado ── */
  .res h2{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--orange);margin-bottom:10px}
  .nivelazo{background:linear-gradient(135deg,var(--navy),var(--azul));color:#fff;border-radius:13px;
    padding:22px;text-align:center;margin-bottom:16px}
  .nivelazo .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;color:#a8c3d6;margin-bottom:7px}
  .nivelazo .big{font-family:'Overpass',sans-serif;font-size:clamp(1.5rem,6vw,2.1rem);font-weight:900;line-height:1.15}
  .nivelazo .perfil{display:inline-block;margin-top:12px;background:rgba(232,160,74,.2);
    border:1px solid rgba(232,160,74,.5);color:var(--orange-d);font-size:.8rem;font-weight:700;
    padding:6px 14px;border-radius:99px}
  .fila{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px dashed var(--line);font-size:.88rem}
  .fila:last-child{border-bottom:0}
  .fila small{color:var(--ink2);display:block;font-size:.76rem;margin-top:2px}
  .chip{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
  .chip.ok{background:var(--chip-ok);color:var(--ok)}
  .chip.no{background:var(--chip-bad);color:var(--bad)}
  .aviso{background:#fff7ec;border-left:3px solid var(--orange);border-radius:0 9px 9px 0;
    padding:14px 16px;margin-top:14px;font-size:.9rem;line-height:1.6}
  .aviso b{color:var(--navy)}
  .cita{background:#eef4f8;border-radius:11px;padding:16px;margin-top:14px}
  .cita h4{font-size:.76rem;text-transform:uppercase;letter-spacing:.07em;color:var(--navy);margin-bottom:7px}
  .cita p{font-size:.89rem;color:var(--ink2);line-height:1.6}
  .pie{color:#9fb4c4;font-size:.76rem;text-align:center;margin-top:18px;line-height:1.6}
  .codigo{font-family:ui-monospace,monospace;font-weight:700;letter-spacing:.06em;
    background:var(--navy2);color:var(--orange-d);padding:4px 9px;border-radius:6px;font-size:.82rem}
  .aviso-correo{font-size:.92rem;line-height:1.45;color:#0E2438;
  background:#FBF0DA;border-left:3px solid #E8A04A;border-radius:0 6px 6px 0;
  padding:10px 12px;margin:10px 0 14px}
.enviando{font-size:.85rem;color:var(--ink2);text-align:center;padding:10px}
  .oculto{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Máster Internacional BIM + IA</p>
    <h1 id="tituloCab">Diagnóstico BIM</h1>
    <p id="subCab">20 preguntas sobre lo que sabes hacer en un proyecto real. Cinco minutos.
      Tu perfil te lo entrega tu asesor en la cita.</p>
    <div class="barra"><i id="barra"></i></div>
    <p class="cuenta" id="cuenta">Pregunta 1 de 20</p>
  </header>

  <div id="app"></div>
</div>

<script src="preguntas.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────────────────
   CONFIGURACIÓN — lo único que se toca al montarlo
   ───────────────────────────────────────────────────────────────────────── */
const CFG = {
  /* Formulario NATIVO de GoHighLevel donde aterriza el resultado.
     Nativo y no webhook a propósito: el webhook de GHL es prémium y cobra por
     ejecución; el formulario nativo es gratis y el contacto entra al CRM igual.
     Se rellena por querystring con las claves de los campos personalizados. */
  FORM_GHL: 'https://api.leadconnectorhq.com/widget/form/c9q5RXwZp3kDRuwk1eCz',

  /* Claves de los campos ocultos, LEÍDAS del formulario real (9-sep-2026), no
     inventadas. En el HTML del formulario cada campo lleva su clave en
     `data-q`, y el prellenado de GHL cruza el querystring contra esa clave
     exacta.

     OJO CON LAS TILDES: GHL genera la clave a partir de la ETIQUETA del campo.
     «Perfil técnico» produjo `perfil_técnico`, con tilde. Si alguien renombra
     una etiqueta en GHL, la clave cambia y ESE CAMPO LLEGA VACÍO sin que nada
     avise. Para comprobarlas: abrir el formulario y buscar `data-q=` en el
     código fuente. */
  CAMPOS: {
    nivel:      'nivel_bim',
    perfil:     'perfil_técnico',
    modulo:     'módulo_recomendado',
    codigo:     'código_de_diagnóstico',
    enlace:     'enlace_del_resultado',
    detalle:    'detalle_del_diagnóstico',
    puntajes:   'puntajes_por_bloque',
  },
};

/* GHL destruye el signo «+» en el prellenado: su propio código hace
   .replace(/\+/g,' ') sobre el valor, porque asume que un «+» es un espacio
   codificado. No hay forma de colarle un «+» literal — ni con %2B.
   Como varios valores nuestros lo llevan («Especialista BIM + IA»,
   «BIM + IA · AUTOMATIZA»), llegarían al CRM como «Especialista BIM   IA».
   Se cambia por « y », que se lee bien y no depende de nada. */
const paraGHL = v => String(v).replace(/\s*\+\s*/g, ' y ');

/* ─────────────────────────────────────────────────────────────────────────
   Estado
   ───────────────────────────────────────────────────────────────────────── */
const R = new Array(TODAS.length).fill(null);
let cursor = 0;

/* El closer manda el enlace con el contacto identificado. Si no viene, el
   test funciona igual pero el resultado no se puede pegar a nadie: por eso la
   pantalla final siempre ofrece el código, que sirve incluso sin parámetros. */
const Q = new URLSearchParams(location.search);
const CONTACTO = {
  id:     Q.get('cid')    || '',
  nombre: Q.get('nombre') || '',
  email:  Q.get('email')  || '',
  /* El teléfono del formulario es OBLIGATORIO. Si no viaja en el enlace, la
     persona lo teclea, y lo que teclee SUSTITUYE al que ya tiene la ficha en
     el CRM: un dedazo deja al closer sin WhatsApp. Por eso el enlace del
     closer debe llevarlo. Se aceptan los dos nombres porque `tel` es el que
     documenta la guía y `phone` el que sale solo al copiar de GHL. */
  tel:    Q.get('tel')    || Q.get('phone') || '',
};

/* ─────────────────────────────────────────────────────────────────────────
   Pantallas
   ───────────────────────────────────────────────────────────────────────── */
const app = document.getElementById('app');
const pct1 = n => (n*100).toFixed(0);

function pintarPregunta(){
  const q = TODAS[cursor];
  document.getElementById('barra').style.width = ((cursor)/TODAS.length*100)+'%';
  document.getElementById('cuenta').textContent = `Pregunta ${cursor+1} de ${TODAS.length}`;

  app.innerHTML = `
    <div class="card">
      <p class="grupo">${q.grupo}</p>
      <p class="preg">${q.texto}</p>
      <div class="ops">${OPCIONES.map(o =>
        `<button class="op${R[cursor]===o.v?' sel':''}" data-v="${o.v}">${o.t}</button>`).join('')}</div>
      <div class="nav">
        ${cursor>0 ? '<button class="btn sec" id="atras">Atrás</button>' : ''}
        <button class="btn" id="sig" ${R[cursor]===null?'disabled':''}>
          ${cursor===TODAS.length-1 ? 'Terminar' : 'Siguiente'}</button>
      </div>
    </div>`;

  app.querySelectorAll('.op').forEach(b => b.onclick = () => {
    R[cursor] = +b.dataset.v;
    app.querySelectorAll('.op').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    app.querySelector('#sig').disabled = false;
    setTimeout(avanzar, 180);   // avance automático: 20 preguntas con dos clics cada una se abandonan
  });
  const atras = app.querySelector('#atras');
  if(atras) atras.onclick = () => { cursor--; pintarPregunta(); };
  app.querySelector('#sig').onclick = avanzar;
}

function avanzar(){
  if(R[cursor]===null) return;
  if(cursor < TODAS.length-1){ cursor++; pintarPregunta(); }
  else pintarResultado();
}

function pintarResultado(){
  const r = calcular(R);

  /* DECISIÓN COMERCIAL, 7-sep: el resultado NO se muestra aquí.
   *
   * La primera versión enseñaba el nivel y el perfil al terminar. Dayana lo
   * cambió y tiene razón: si la persona ya sabe que es Coordinador BIM, la
   * cita pasa a ser opcional. Guardando el resultado, la llamada deja de ser
   * «una presentación de ventas» y pasa a ser el sitio donde recoge algo que
   * ya es suyo y que todavía no ha visto.
   *
   * El cálculo se hace igual y viaja completo al CRM: lo único que cambia es
   * quién se lo cuenta al alumno. */

  document.getElementById('barra').style.width = '100%';
  document.getElementById('cuenta').textContent = 'Diagnóstico completo';
  document.getElementById('tituloCab').textContent = 'Listo, ya tenemos tu perfil';
  document.getElementById('subCab').textContent =
    'Tu asesor académico lo tiene delante. Te lo explica en la cita.';

  app.innerHTML = `
    <div class="card res">
      <div class="nivelazo">
        <p class="lbl">Tu diagnóstico</p>
        <p class="big">Completo</p>
        <span class="perfil">20 de 20 respondidas</span>
      </div>

      <div class="cita">
        <h4>Y ahora, la cita</h4>
        <p><b>Gracias por completar el diagnóstico.</b> No es un test genérico:
        con lo que acabas de responder ya sabemos en qué nivel BIM estás, de qué
        base técnica vienes y qué te falta para el siguiente escalón.</p>
        <p style="margin-top:9px">Ese perfil <b>te lo entrega tu asesor académico
        en la cita</b>, no un correo automático. Y no es por hacerte esperar: tu
        resultado tiene matices —cosas que dominas por encima de tu nivel, huecos
        que se cierran más rápido de lo que parece— y eso se explica hablando, no
        en una pantalla.</p>
        <p style="margin-top:9px">En la llamada vas a salir sabiendo <b>exactamente
        por dónde entrar</b>, qué módulo te corresponde, cuál te haría perder el
        tiempo y cómo encaja con lo que estás haciendo ahora. Una conversación
        sobre tu caso concreto.</p>
      </div>

      <div class="aviso">
        <b>Llega a tu cita con esto en mente:</b> no vas a tener que explicar
        desde cero quién eres ni qué sabes hacer. Tu asesor ya lo leyó.
      </div>

      <div id="envio"></div>

      <p class="pie">Tu código de diagnóstico es <span class="codigo">${r.codigo}</span>.
        Si tu asesor te lo pide al empezar la llamada, es este.</p>
    </div>`;

  entregar(r);
}

/* ─────────────────────────────────────────────────────────────────────────
   Entrega del resultado al CRM
   ───────────────────────────────────────────────────────────────────────── */
function detalleTexto(r){
  const L = [];
  L.push(`NIVEL BIM: ${r.nivel===0?'En camino a Modelador':BLOQUES[r.nivel-1].nivel}`);
  L.push(`PERFIL TÉCNICO: ${r.perfil}`);
  L.push(`MÓDULO RECOMENDADO: ${r.siguiente ? r.siguiente.modulo+' ('+r.siguiente.meses+')' : 'Ruta completa cerrada — candidato a mentoría o a BIM+IA avanzado'}`);
  L.push('');
  L.push('NIVELES:');
  r.bloques.forEach(b => L.push(`  ${b.dominado?'[X]':'[ ]'} ${b.nivel} — ${b.pts}/${b.max} (${pct1(b.pct)}%)`));
  if(r.dispersos.length) L.push(`  ! Conocimiento disperso en: ${r.dispersos.map(b=>b.nivel).join(', ')}`);
  L.push('');
  L.push('BASE TÉCNICA:');
  r.ejes.forEach(e => L.push(`  ${e.base?'[X]':'[ ]'} ${e.nombre} — ${e.pts}/${e.max}`));
  L.push('');
  L.push('PARA EL ASESOR: ' + guionAsesor(r));
  return L.join('\n');
}

/* La frase que el closer lee de un vistazo. Es lo que de verdad usa. */
function guionAsesor(r){
  const nivel = r.nivel===0 ? 'Arranca de cero en BIM' : `Domina hasta ${BLOQUES[r.nivel-1].corto}`;
  const base = { EST:'viene de cálculo estructural', ARQ:'viene de arquitectura',
                 MIXTO:'maneja estructuras y arquitectura', BASE:'sin base técnica consolidada' }[r.perfilCorto];
  const entrar = r.siguiente ? `Entrar por ${r.siguiente.modulo}` : 'Ya cubre la ruta: ofrecer mentoría o especialización';
  return `${nivel}, ${base}. ${entrar}.`;
}

function entregar(r){
  const cont = document.getElementById('envio');
  /* El enlace del panel: lleva las 20 respuestas dentro, así que no depende
     de ninguna base de datos y no puede quedarse huérfano. Es lo que el asesor
     abre y comparte en pantalla durante la llamada. */
  const enlace = new URL('resultado.html', location.href);
  enlace.searchParams.set('r', empaquetar(R));
  if(CONTACTO.nombre) enlace.searchParams.set('n', CONTACTO.nombre);

  const datos = {
    [CFG.CAMPOS.nivel]:    paraGHL(r.nivel===0 ? 'En camino a Modelador BIM' : BLOQUES[r.nivel-1].nivel),
    [CFG.CAMPOS.perfil]:   paraGHL(r.perfil),
    [CFG.CAMPOS.modulo]:   paraGHL(r.siguiente ? r.siguiente.modulo : 'Ruta completa'),
    [CFG.CAMPOS.codigo]:   r.codigo,
    /* el enlace NO pasa por paraGHL: no lleva «+» y tocarlo lo rompería */
    [CFG.CAMPOS.enlace]:   enlace.toString(),
    [CFG.CAMPOS.detalle]:  paraGHL(detalleTexto(r)),
    [CFG.CAMPOS.puntajes]: r.bloques.map(b=>`${b.id}:${b.pts}/${b.max}`).join(' ')
                           + ' | ' + r.ejes.map(e=>`${e.id}:${e.pts}/${e.max}`).join(' '),
  };
  /* GHL cruza el contacto por el CORREO, no por el id: `contact_id` NO está
     en su lista de campos que prellena (full_name, first_name, last_name,
     phone, email, organization, address, city, state, country, postal_code),
     así que se manda pero lo ignora. Se deja porque viaja en el payload del
     envío y no estorba — pero el que evita el duplicado es `email`.
     Por eso la plantilla de WhatsApp del closer lleva {{contact.email}}: si
     vuelve el mismo correo, GHL actualiza la ficha que ya existe en vez de
     crear una nueva. */
  if(CONTACTO.id)     datos.contact_id = CONTACTO.id;
  if(CONTACTO.nombre) datos.full_name  = CONTACTO.nombre;
  if(CONTACTO.email)  datos.email      = CONTACTO.email;
  if(CONTACTO.tel)    datos.phone      = CONTACTO.tel;

  if(CFG.FORM_GHL.includes('PEGAR_ID')){
    cont.innerHTML = `<div class="aviso"><b>Falta conectar el formulario de GoHighLevel.</b>
      El diagnóstico se calculó bien, pero todavía no tiene a dónde enviarse.
      Está en la guía de montaje, paso 2.</div>`;
    return;
  }

  const url = CFG.FORM_GHL + '?' + new URLSearchParams(datos).toString();

  /* El formulario se MUESTRA. Antes iba en un iframe de altura 0 y al terminar
     de cargar la pantalla decía «Listo. Tu asesor ya lo tiene.» — y era falso:
     prellenar un formulario NO lo envía. Nadie pulsaba «Continuar», así que no
     se creaba el contacto y el diagnóstico no llegaba al CRM. Es el mismo
     patrón del incidente de julio: el paso se daba por hecho sin comprobar la
     entrega.
     Además el formulario lleva la casilla de consentimiento, y esa la marca la
     persona. Enviarlo por debajo sería marcarla por ella. */
  /* La línea del correo cambia según venga o no en el enlace, porque el
     riesgo es distinto. Casi todos llegan desde una pauta y YA tienen ficha en
     el CRM: si escriben otro correo se crea un contacto nuevo y el asesor
     acaba con la persona partida en dos. */
  const avisoCorreo = CONTACTO.email
    ? `Tu correo ya viene puesto (<b>${CONTACTO.email}</b>). Déjalo tal cual:
       es lo que hace que este diagnóstico se sume a tu ficha.`
    : `Escribe el <b>mismo correo</b> con el que te registraste. Si pones otro,
       tu diagnóstico se guarda aparte y tu asesor no lo va a encontrar.`;

  cont.innerHTML = `
    <p class="enviando">Un paso más para que tu asesor lo reciba:
      revisa tus datos, marca la casilla y pulsa <b>Continuar</b>.</p>
    <p class="aviso-correo">${avisoCorreo}</p>
    <iframe src="${url}" style="width:100%;height:560px;border:0" title="Envío del diagnóstico"></iframe>`;
}

pintarPregunta();
</script>
</body>
</html>

<!-- ============================================================
     PLANTILLA DE CORREO — secuencias de seguimiento DMA
     Pegar en GHL → Marketing → Emails → New → Code/HTML Editor.

     POR QUÉ ESTA Y NO LA DEL SKILL dma-email-campaign:
     aquella pesa ~860 KB porque lleva las imágenes en base64. Gmail
     RECORTA cualquier correo que pase de 102 KB y muestra un "[Mensaje
     recortado]" justo donde iba el botón. Sirve para un broadcast
     bonito de una vez; no sirve para una secuencia de 7 correos.
     Esta pesa menos de 8 KB: tabla de 600 px, estilos en línea, y las
     dos únicas imágenes se cargan por URL.

     CÓMO SE USA: se guarda UNA sola vez como plantilla en GHL y cada
     correo de las secuencias solo reemplaza:
       [[TITULO]]  [[CUERPO]]  [[TEXTO_BOTON]]  [[ENLACE_BOTON]]  [[PD]]
     Lo demás (cabecera, pie, baja) no se toca nunca.

     LAS 3 REGLAS QUE NO SE ROMPEN:
     1. {{unsubscribe_url}} va SIEMPRE. Sin eso se quema el dominio.
     2. Nada de base64. Imágenes por URL o ninguna.
     3. Estilos EN LÍNEA (style="..."), no en <style>. Gmail borra
        las hojas de estilo del <head>.
     ============================================================ -->

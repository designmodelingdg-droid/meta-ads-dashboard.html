name: Vimeo — sonda de transcripciones

# ¿Las clases tienen transcripcion? De esto depende el asistente de cursos.
# Solo LEE: no toca la privacidad ni el estado de ningun video.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sondar transcripciones
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
        run: python3 scripts/vimeo_transcripcion.py
      - name: Commit si cambió
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matriz-viral/fuentes/vimeo-transcripcion-muestra.md
          git diff --staged --quiet && echo "Nada nuevo." && exit 0
          git commit -m "Sonda de transcripciones de Vimeo"
          git push

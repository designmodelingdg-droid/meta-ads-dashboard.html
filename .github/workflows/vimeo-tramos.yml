name: Vimeo — tramos para lecciones

# Baja tramos de clases (hasta 15 min cada uno) para convertirlas en lecciones
# cortas del Campus. Solo LEE de Vimeo. Los videos quedan como artefacto del
# run (7 días); no se guardan en git.

on:
  workflow_dispatch:
    inputs:
      tramos:
        description: "nombre=video@desde-hasta separados por punto y coma (máx. 15 min cada uno)"
        required: true

permissions:
  contents: read

concurrency:
  group: vimeo-clips
  cancel-in-progress: false

jobs:
  tramos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Bajar tramos
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          TRAMOS: ${{ inputs.tramos }}
        run: python3 scripts/vimeo_tramos.py "$TRAMOS"
      - uses: actions/upload-artifact@v4
        with:
          name: tramos
          path: tramos/
          retention-days: 7

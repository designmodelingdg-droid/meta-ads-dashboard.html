name: Vimeo — clips de clases

# Para los reels de prueba social (skill clips-clases-vimeo).
# 1) modo «transcribir»: pon un tema (o una carpeta) y guarda la transcripción
#    de esas clases para elegir los momentos.
# 2) modo «recortar»: pon el id del video y los minutos elegidos; baja solo ese
#    tramo en 720p.
# Todo se guarda en la rama `vimeo-clips`, nunca en la principal.
# Solo LEE de Vimeo: no toca la privacidad ni el estado de ningún video.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué hacer"
        type: choice
        options: [transcribir, recortar, listar, whisper, acero]
        default: transcribir
      tema:
        description: "transcribir · tema a buscar en los nombres (p. ej. conexiones, naves, Revit IA)"
        required: false
      carpeta:
        description: "transcribir · nombre exacto de la carpeta de Vimeo (opcional; manda sobre el tema)"
        required: false
      max_videos:
        description: "transcribir · cuántas clases como mucho (1-20)"
        required: false
        default: "8"
      video:
        description: "recortar · id del video de Vimeo"
        required: false
      desde:
        description: "recortar · inicio (12:30 o 1:02:15). Varios tramos separados por coma"
        required: false
      hasta:
        description: "recortar · fin (13:20). Mismo número de tramos que «desde», máx. 90 s cada uno"
        required: false

permissions:
  contents: write

concurrency:
  group: vimeo-clips-${{ inputs.modo }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ inputs.modo == 'whisper' }}
    runs-on: ubuntu-latest
    outputs:
      ids: ${{ steps.p.outputs.ids }}
    steps:
      - id: p
        env:
          VIDEO: ${{ inputs.video }}
        run: echo "ids=$(python3 -c 'import json,os;print(json.dumps([x.strip() for x in os.environ["VIDEO"].split(",") if x.strip()]))')" >> "$GITHUB_OUTPUT"

  whisper:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/vimeo_whisper.py
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper==1.1.1 requests
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - name: Transcribir
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
        run: python3 scripts/vimeo_whisper.py "${{ matrix.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-${{ matrix.id }}
          path: whisper/
          retention-days: 14

  clips:
    if: ${{ inputs.modo != 'whisper' && inputs.modo != 'acero' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg
        if: ${{ inputs.modo == 'recortar' }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Preparar la rama vimeo-clips
        run: |
          cp scripts/vimeo_clips.py /tmp/vimeo_clips.py
          cp scripts/vimeo_tramos.py /tmp/vimeo_tramos.py
          cp scripts/vimeo_listar.py /tmp/vimeo_listar.py
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/vimeo-clips >/dev/null; then
            git fetch --depth 1 origin vimeo-clips
            git checkout -B vimeo-clips FETCH_HEAD
          else
            git checkout --orphan vimeo-clips
            git rm -rq --cached . && git clean -fdq
            echo "# Clips de clases desde Vimeo (rama de trabajo, la llena la Action «Vimeo — clips»)" > README.md
            git add README.md && git commit -qm "Rama vimeo-clips"
          fi

      - name: Transcribir
        if: ${{ inputs.modo == 'transcribir' }}
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          TEMA: ${{ inputs.tema }}
          CARPETA: ${{ inputs.carpeta }}
          MAXV: ${{ inputs.max_videos }}
        run: python3 /tmp/vimeo_clips.py transcribir --tema "$TEMA" --carpeta "$CARPETA" --max "${MAXV:-8}"

      - name: Listar carpetas
        if: ${{ inputs.modo == 'listar' }}
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
        run: python3 /tmp/vimeo_listar.py

      - name: Recortar
        if: ${{ inputs.modo == 'recortar' }}
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          VIDEO: ${{ inputs.video }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
        run: cd /tmp && python3 /tmp/vimeo_tramos.py "$VIDEO"

      - name: Subir tramos como artefacto
        if: ${{ inputs.modo == 'recortar' }}
        uses: actions/upload-artifact@v4
        with:
          name: tramos
          path: /tmp/tramos/
          retention-days: 7

      - name: Guardar en la rama vimeo-clips
        run: |
          git add vimeo-clips
          git diff --staged --quiet && echo "Nada nuevo." && exit 0
          git commit -qm "Vimeo clips: ${{ inputs.modo }} ${{ inputs.tema }}${{ inputs.carpeta }}${{ inputs.video }}"
          git push origin vimeo-clips

  acero_plan:
    if: ${{ inputs.modo == 'acero' }}
    runs-on: ubuntu-latest
    outputs:
      lotes: ${{ steps.p.outputs.lotes }}
    steps:
      - id: p
        env:
          LOTES: ${{ inputs.video }}
        run: echo "lotes=$(python3 -c 'import json,os;print(json.dumps([x.strip() for x in os.environ["LOTES"].split(";") if x.strip()]))')" >> "$GITHUB_OUTPUT"

  acero:
    needs: acero_plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lote: ${{ fromJSON(needs.acero_plan.outputs.lotes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper==1.1.1 requests opencv-python-headless pillow numpy
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small
      - run: mkdir -p trabajo && cd trabajo && npm init -y >/dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Armar
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
        run: python3 acero/pipeline.py "${{ matrix.lote }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acero-${{ matrix.lote }}
          path: trabajo/out/
          retention-days: 3

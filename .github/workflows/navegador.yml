name: Navegador GHL

# Automatiza GoHighLevel con un navegador, para lo que su API no deja hacer:
# crear y publicar workflows, tocar páginas de Sites, y sacar el mapa de qué
# plantilla usa cada workflow.
#
# Se dispara SIEMPRE a mano. Nunca en cron: esto puede escribir en un CRM de
# producción y eso no corre solo.
#
# REQUISITO (una vez): el secreto GHL_STORAGE_STATE.
#   Cómo generarlo está en scripts/navegador/README.md — son cinco minutos y
#   evita poner la contraseña de la cuenta como secreto.

on:
  workflow_dispatch:
    inputs:
      tarea:
        description: "Qué hacer"
        required: true
        type: choice
        options:
          - sesion
          - mapa-flujos
          - paginas
          - encender
          - restaurar-pagina
          - pegar-html
        default: sesion
      objetivo:
        description: "Nombre del workflow o de la página (encender / restaurar / pegar-html)"
        required: false
        default: ""
      archivo:
        description: "Solo pegar-html · archivo del repo a pegar (ej: recursos/ghl-recursos.html)"
        required: false
        default: ""
      url:
        description: "Solo pegar-html · dirección PÚBLICA con la que se verifica el cambio"
        required: false
        default: ""
      aplicar:
        description: "false = simulacro (recorre y no toca nada) · true = escribe de verdad"
        required: true
        type: choice
        options: ["false", "true"]
        default: "false"
      limite:
        description: "Máximo de objetos a recorrer (solo mapa-flujos)"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: navegador-ghl          # nunca dos corridas escribiendo a la vez
  cancel-in-progress: false

jobs:
  navegar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Playwright y Chromium
        run: |
          set -euo pipefail
          npm install -g playwright@1.56.1
          npx --yes playwright@1.56.1 install --with-deps chromium

      - name: Comprobar que hay con qué entrar
        env:
          GHL_STORAGE_STATE: ${{ secrets.GHL_STORAGE_STATE }}
          GHL_USER: ${{ secrets.GHL_USER }}
          GHL_PASS: ${{ secrets.GHL_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${GHL_STORAGE_STATE:-}" ] && [ -z "${GHL_USER:-}" ]; then
            echo "::error::No hay GHL_STORAGE_STATE ni GHL_USER. Mira scripts/navegador/README.md."
            exit 1
          fi
          if [ -z "${GHL_STORAGE_STATE:-}" ]; then
            echo "::warning::Sin GHL_STORAGE_STATE. Se intentará con usuario y contraseña, que falla si la cuenta pide 2FA."
          fi

      - name: Ejecutar la tarea
        env:
          GHL_STORAGE_STATE: ${{ secrets.GHL_STORAGE_STATE }}
          GHL_USER: ${{ secrets.GHL_USER }}
          GHL_PASS: ${{ secrets.GHL_PASS }}
        run: |
          set -euo pipefail
          TAREA="${{ github.event.inputs.tarea }}"
          OBJ="${{ github.event.inputs.objetivo }}"
          ARGS=""
          # Un case y no una cadena de [ ] && …: con `set -e` esa cadena es una
          # trampa, porque el estado del ultimo enlace se convierte en el del
          # paso entero y el Action se pone rojo sin que nada haya fallado.
          case "$TAREA" in
            mapa-flujos)
              ARGS="--limite ${{ github.event.inputs.limite }}" ;;
            encender)
              [ -n "$OBJ" ] || { echo "::error::«encender» necesita el nombre del workflow en «objetivo»."; exit 1; }
              ARGS="--flujo \"$OBJ\"" ;;
            restaurar-pagina)
              [ -n "$OBJ" ] || { echo "::error::«restaurar-pagina» necesita el nombre en «objetivo»."; exit 1; }
              ARGS="--pagina \"$OBJ\"" ;;
            pegar-html)
              ARCH="${{ github.event.inputs.archivo }}"
              URL="${{ github.event.inputs.url }}"
              [ -n "$OBJ" ]  || { echo "::error::«pegar-html» necesita el nombre de la pagina en «objetivo»."; exit 1; }
              [ -n "$ARCH" ] || { echo "::error::«pegar-html» necesita «archivo»."; exit 1; }
              # Sin --url no hay verificacion posible, y una escritura sin
              # verificar es peor que no escribir: parece hecha y no lo esta.
              [ -n "$URL" ]  || { echo "::error::«pegar-html» necesita «url»: es la direccion publica con la que se comprueba que el cambio llego."; exit 1; }
              ARGS="--pagina \"$OBJ\" --archivo \"$ARCH\" --url \"$URL\"" ;;
          esac
          if [ "${{ github.event.inputs.aplicar }}" = "true" ]; then
            ARGS="$ARGS --aplicar"
          fi
          echo "→ node scripts/navegador/tareas.js $TAREA $ARGS"
          eval node scripts/navegador/tareas.js "$TAREA" $ARGS

      # La evidencia se sube SIEMPRE, sobre todo si falló: es lo que permite ver
      # qué cambió GHL de sitio en vez de adivinar.
      - name: Guardar capturas y HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-navegador
          path: matriz-viral/fuentes/navegador/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit de lo que se leyó
        if: always()
        run: |
          set -euo pipefail
          # Solo los JSON de lectura. Las capturas NO entran al repo: pesan y
          # pueden mostrar datos de contactos en pantalla.
          if git status --porcelain -- 'matriz-viral/fuentes/navegador/*.json' | grep -q .; then
            git config user.name  "matriz-bot"
            git config user.email "noreply@anthropic.com"
            git add 'matriz-viral/fuentes/navegador/*.json'
            git commit -m "Lectura por navegador de GoHighLevel"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push
          else
            echo "Nada nuevo que guardar."
          fi

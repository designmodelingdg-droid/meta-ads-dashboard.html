name: Métricas semanales (Meta Graph API)

# Trae las métricas orgánicas de Instagram y Facebook con la API oficial de Meta
# y actualiza matriz-viral/matriz/matriz.json. Corre solo cada semana: Dayana no
# tiene que pasar nada a mano.
#
# REQUISITO (una sola vez): agregar el secreto del repo META_TOKEN
#   Settings → Secrets and variables → Actions → New repository secret
#   Name: META_TOKEN   Value: (el token de System User de "Design Modeling - Ads CLI")
#   Ese token NO expira, así que se configura una vez y ya.
#
# Qué trae:
#   Instagram → views, alcance, likes, comentarios, guardados, compartidos,
#               interacciones, visitas al perfil, seguidores nuevos.
#   Facebook  → comentarios, likes y compartidos por post.
#   (Las VISTAS por post de Facebook ya no existen en la API de Meta — ese dato
#    sigue siendo manual si se necesita.)

on:
  schedule:
    - cron: "0 13 * * 1"      # lunes 13:00 UTC (~08:00 Ecuador) — metricas organicas
    - cron: "0 12 * * 5"      # viernes 12:00 UTC (~07:00 Ecuador) — datos de pauta,
                              # antes de que llegue el reporte de la agencia
  workflow_dispatch:
    inputs:
      limit:
        description: "Cuántas publicaciones revisar"
        required: false
        default: "30"
      solo_creativos:
        description: "true = solo bajar imágenes de anuncios ganadores (scripts/ads_creativos.py)"
        required: false
        default: "false"
      desde:
        description: "Ventana de creativos: inicio (YYYY-MM-DD)"
        required: false
        default: ""
      hasta:
        description: "Ventana de creativos: fin (YYYY-MM-DD)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write      # para despertar a publish-matriz al final (ver ese paso)

concurrency:
  group: metricas-semanales
  cancel-in-progress: false

jobs:
  creativos:
    if: github.event.inputs.solo_creativos == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bajar imágenes de anuncios ganadores
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          DESDE: ${{ github.event.inputs.desde }}
          HASTA: ${{ github.event.inputs.hasta }}
        run: |
          set -euo pipefail
          if [ -z "${META_TOKEN:-}" ]; then
            echo "::error::Falta el secreto META_TOKEN. Settings → Secrets and variables → Actions."
            exit 1
          fi
          python3 scripts/ads_creativos.py

      - name: Commit si cambió
        run: |
          set -euo pipefail
          if git status --porcelain -- matriz-viral/fuentes/ads-creativos/ | grep -q .; then
            git config user.name  "matriz-bot"
            git config user.email "noreply@anthropic.com"
            git add matriz-viral/fuentes/ads-creativos/
            git commit -m "Imagenes de anuncios ganadores (Meta Ads API)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push
          else
            echo "Sin creativos nuevos."
          fi

  metricas:
    if: github.event.inputs.solo_creativos != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Traer métricas de Meta
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${META_TOKEN:-}" ]; then
            echo "::error::Falta el secreto META_TOKEN. Settings → Secrets and variables → Actions."
            exit 1
          fi
          python3 scripts/meta_organico.py --limit "${{ github.event.inputs.limit || '30' }}"

      - name: Traer datos reales de las campañas (para auditar el reporte)
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        continue-on-error: true      # si falla, no rompe la actualización principal
        run: python3 scripts/ads_insights.py --dias 30

      - name: Traer ingresos reales (Stripe + PayPal)
        env:
          STRIPE_SECRET_KEY:  ${{ secrets.STRIPE_SECRET_KEY }}
          CLIEND_ID_PAYPAL:   ${{ secrets.CLIEND_ID_PAYPAL }}
          SECRET_KEY_PAYPAL:  ${{ secrets.SECRET_KEY_PAYPAL }}
        continue-on-error: true      # si falla, no rompe la actualización principal
        run: python3 scripts/ingresos.py --dias 30

      - name: Sondar qué deja leer la API de GoHighLevel
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        continue-on-error: true
        run: python3 scripts/ghl_sonda.py

      - name: Traer los datos del CRM (GoHighLevel)
        continue-on-error: true
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: python3 scripts/ghl_datos.py

      - name: Sondar los correos de las automatizaciones
        continue-on-error: true
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: python3 scripts/ghl_correos.py

      - name: Analizar conversaciones del CRM (perfilado de leads)
        continue-on-error: true
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: python3 scripts/ghl_conversaciones.py --limite 300

      # Sin este paso la auditoría técnica de la cuenta solo puede evaluar 14
      # de 50 checks: los 36 que faltan son de Píxel/CAPI, que pesan el 30%
      # del score, y no salen de la API de Insights sino del nodo AdsPixel.
      # `aggregation=event_source` separa WEB_ONLY de SERVER_ONLY, que es la
      # única forma fiable de saber por API si la Conversions API está viva.
      - name: Traer el estado del píxel y de la CAPI
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        continue-on-error: true      # si falla, no rompe la actualización principal
        run: python3 scripts/meta_pixel.py --dias 30

      - name: Traer datos de la competencia
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        continue-on-error: true      # si falla, no rompe la actualización principal
        run: python3 scripts/competencia.py

      - name: Commit si cambió
        id: commit
        run: |
          set -euo pipefail
          RUTAS="matriz-viral/matriz/ matriz-viral/fuentes/ads-insights/ matriz-viral/fuentes/ingresos/ matriz-viral/fuentes/ghl-sonda.json matriz-viral/fuentes/ghl/ matriz-viral/fuentes/meta-pixel/"
          if git diff --quiet -- $RUTAS && ! git status --porcelain -- $RUTAS | grep -q .; then
            echo "Sin cambios."
            echo "cambios=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "cambios=true" >> "$GITHUB_OUTPUT"
          git config user.name  "matriz-bot"
          git config user.email "noreply@anthropic.com"
          git add matriz-viral/matriz/ matriz-viral/fuentes/ads-insights/ matriz-viral/fuentes/ingresos/ matriz-viral/fuentes/ghl-sonda.json matriz-viral/fuentes/ghl/ matriz-viral/fuentes/meta-pixel/
          git commit -m "Métricas semanales automáticas (Meta Graph API)"
          # Puede haber commits nuevos desde que arrancó la corrida: se rebasa
          # antes de empujar. Sin esto el push se rechaza y se pierde el dato.
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "Reintento $i…"; sleep 5
          done
          echo "::error::No se pudo empujar tras 3 intentos."; exit 1

      # Sin este paso la matriz se refresca en git pero NUNCA se publica, y
      # Patricio y el asistente siguen leyendo una versión de julio. Fue así
      # hasta el 16-ago-2026: la Pages llevaba 148 piezas cuando el repo ya
      # tenía 151.
      #
      # El motivo está en la documentación de GitHub: "if a workflow run pushes
      # code using the repository's GITHUB_TOKEN, a new workflow will not run
      # even when the repository contains a workflow configured to run when
      # push events occur". Es decir, el commit de arriba no despierta a
      # publish-matriz por diseño, para evitar bucles.
      #
      # La misma página da la salida: workflow_dispatch y repository_dispatch
      # "always create workflow runs", también con el GITHUB_TOKEN. Así que se
      # lo pide explícitamente.
      - name: Publicar la matriz (despertar a publish-matriz)
        if: steps.commit.outputs.cambios == 'true'
        run: |
          set -euo pipefail
          codigo=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/publish-matriz.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}")
          if [ "$codigo" = "204" ]; then
            echo "publish-matriz lanzado sobre ${GITHUB_REF_NAME}."
          else
            # No se rompe la corrida: el dato ya está commiteado y a salvo.
            # Pero se avisa, porque significa que la Pages se quedó vieja.
            echo "::warning::No se pudo lanzar publish-matriz (HTTP $codigo). $(cat /tmp/resp.txt)"
            echo "::warning::La matriz está en git pero la versión publicada sigue vieja."
          fi

name: Publicar matriz.json (GitHub Pages)

# Publica matriz-viral/matriz/matriz.json y el lead magnet (calculadora de
# zapatas) a GitHub Pages, empujando el contenido a la rama gh-pages.
# Esta vía activa Pages automáticamente y NO requiere ningún paso manual en
# Settings (el método anterior, "Source: GitHub Actions", fallaba porque el
# token del workflow no puede habilitar Pages por sí mismo).
#
# URLs públicas resultantes:
#   https://designmodelingdg-droid.github.io/meta-ads-dashboard.html/matriz.json
#   https://designmodelingdg-droid.github.io/meta-ads-dashboard.html/calculadora-zapatas/

on:
  push:
    branches:
      - claude/remote-control-setup-GUe3f          # rama por defecto (tras merge del PR)
      - claude/matriz-viral-3t356o                 # rama de trabajo (para probar antes del merge)
      - claude/zapatas-calculator-leadmagnet-iaj89j # rama del lead magnet (para probar antes del merge)
      - claude/test-nivel-bim-leadmagnet            # rama del test de nivel BIM (para probar antes del merge)
      - claude/apify-reel-stats-matrix-iihc3x        # rama del seguimiento de leads + imagenes del blog
    paths:
      - matriz-viral/matriz/matriz.json
      - matriz-viral/matriz/guiones-completos.json
      - matriz-viral/matriz/calendario-agosto.json
      - matriz-viral/matriz/competencia.json
      - calculadora-zapatas/**
      - test-nivel-bim/**
      - recursos/**
      - eficiencia-acero/**
  workflow_dispatch: {}                      # permite correrla a mano desde la pestaña Actions

# El token integrado solo necesita poder escribir en la rama gh-pages
permissions:
  contents: write

# Un solo despliegue a la vez; no cancela el que está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Armar carpeta pública
        run: |
          set -euo pipefail
          mkdir -p public
          cp matriz-viral/matriz/matriz.json public/matriz.json
          # Contenido COMPLETO de cada pieza (para que la app no invente)
          cp matriz-viral/matriz/guiones-completos.json public/guiones-completos.json
          # Orden de publicación del mes (fecha -> id de pieza)
          cp matriz-viral/matriz/calendario-agosto.json public/calendario-agosto.json 2>/dev/null || true
          # Radar del sector (competencia)
          cp matriz-viral/matriz/competencia.json public/competencia.json 2>/dev/null || true
          # Lead magnet: landing + calculadora de zapatas
          cp -r calculadora-zapatas public/calculadora-zapatas
          # Lead magnet: landing + test de nivel BIM
          cp -r test-nivel-bim public/test-nivel-bim
          # Hub: todos los recursos gratuitos en un solo sitio
          cp -r recursos public/recursos
          # Lead magnet: guia de las 5 verificaciones + verificador de eficiencia
          cp -r eficiencia-acero public/eficiencia-acero
          # Sin procesamiento Jekyll
          touch public/.nojekyll
          # index mínimo para que la raíz no dé 404 y sirva de estado
          cat > public/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>Design Modeling — datos de contenido</title>
          <body style="font-family:system-ui;max-width:640px;margin:40px auto;padding:0 16px;color:#132433">
          <h1>Design Modeling · datos de contenido</h1>
          <p>Matriz de contenido viral (JSON, legible por máquina):</p>
          <p><a href="./matriz.json"><code>matriz.json</code></a> · <a href="./guiones-completos.json"><code>guiones-completos.json</code></a> (contenido completo de cada pieza) · <a href="./calendario-agosto.json"><code>calendario-agosto.json</code></a> (orden de publicación del mes)</p>
          <p>Lead magnets: <a href="./calculadora-zapatas/">Calculadora de Zapatas</a> · <a href="./test-nivel-bim/">Test de Nivel BIM</a> · <a href="./recursos/">Hub de recursos</a> · <a href="./eficiencia-acero/">5 verificaciones en acero</a></p>
          <p style="color:#5a6b7b">Se actualiza solo cuando cambia la matriz en el repo.</p>
          </body>
          HTML
          echo "Publicando $(python3 -c "import json;print(len(json.load(open('public/matriz.json'))['reels']))") reels."

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          commit_message: 'Publicar sitio (matriz + calculadora de zapatas)'

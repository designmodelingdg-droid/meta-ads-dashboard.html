name: Publicar matriz.json (GitHub Pages)

# Publica matriz-viral/matriz/matriz.json a GitHub Pages para que la app de
# contenido (dg-contenido-ia.vercel.app) lea SIEMPRE la versión fresca desde
# una URL pública, sin que el repo deje de ser privado.
#
# URL pública resultante:
#   https://designmodelingdg-droid.github.io/meta-ads-dashboard.html/matriz.json
#
# Requisito de una sola vez: Settings → Pages → "Build and deployment" →
# Source: "GitHub Actions". (Ver .github/workflows/README.md)

on:
  push:
    branches:
      - claude/remote-control-setup-GUe3f          # rama por defecto (tras merge del PR)
      - claude/matriz-viral-3t356o                 # rama de trabajo (para probar antes del merge)
      - claude/zapatas-calculator-leadmagnet-iaj89j # rama del lead magnet (para probar antes del merge)
    paths:
      - matriz-viral/matriz/matriz.json
      - calculadora-zapatas/**
  workflow_dispatch: {}                      # permite correrla a mano desde la pestaña Actions

# Permisos mínimos para desplegar a Pages con el token integrado (sin PAT)
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela el que está en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Armar carpeta pública
        run: |
          set -euo pipefail
          mkdir -p public
          cp matriz-viral/matriz/matriz.json public/matriz.json
          # Lead magnet: landing + calculadora de zapatas
          cp -r calculadora-zapatas public/calculadora-zapatas
          # index mínimo para que la raíz no dé 404 y sirva de estado
          cat > public/index.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <title>Design Modeling — datos de contenido</title>
          <body style="font-family:system-ui;max-width:640px;margin:40px auto;padding:0 16px;color:#132433">
          <h1>Design Modeling · datos de contenido</h1>
          <p>Matriz de contenido viral (JSON, legible por máquina):</p>
          <p><a href="./matriz.json"><code>matriz.json</code></a></p>
          <p>Lead magnet: <a href="./calculadora-zapatas/">Calculadora de Zapatas</a></p>
          <p style="color:#5a6b7b">Se actualiza solo cuando cambia la matriz en el repo.</p>
          </body>
          HTML
          echo "Publicando $(python3 -c "import json;print(len(json.load(open('public/matriz.json'))['reels']))") reels."

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Desplegar a Pages
        id: deploy
        uses: actions/deploy-pages@v4

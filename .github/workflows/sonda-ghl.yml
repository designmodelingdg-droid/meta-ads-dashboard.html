name: Sonda GHL (qué deja leer la API)

# Prueba QUE endpoints de GoHighLevel responden con nuestro token. No baja
# datos de negocio y no escribe nada en el CRM: solo pregunta y anota el
# codigo de respuesta.
#
# Existe aparte de «Métricas semanales» porque contestar una pregunta concreta
# —«¿se pueden leer los pasos de un workflow?»— no deberia obligar a correr la
# semana entera de Meta, Stripe, PayPal y competencia.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonda-ghl
  cancel-in-progress: false

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sondar la API de GoHighLevel
        env:
          GHL_TOKEN: ${{ secrets.GHL_TOKEN }}
        run: python3 scripts/ghl_sonda.py

      - name: Commit si cambió
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add matriz-viral/fuentes/ghl-sonda.json
          git diff --staged --quiet && echo "Nada nuevo que guardar." && exit 0
          git commit -m "Sonda de la API de GoHighLevel"
          git push

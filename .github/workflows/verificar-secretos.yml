name: Verificar secretos (OpenReply)

# Comprueba que los secretos que necesita el conector de OpenReply existen y
# sirven. Nunca imprime su valor: solo «existe / no existe» y, para la llave
# de API, si OpenReply la acepta.
#
# Se corre a mano (Actions → Verificar secretos → Run workflow) cada vez que
# se crea, rota o revoca una llave, para no descubrir a mitad de una tarea
# que el secreto no estaba.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Existencia de los secretos
        env:
          DB_URL: ${{ secrets.OPENREPLY_DATABASE_URL }}
          API_KEY: ${{ secrets.OPENREPLY_API_KEY }}
        run: |
          ok=1
          if [ -n "$DB_URL" ]; then echo "OPENREPLY_DATABASE_URL: existe"; else echo "OPENREPLY_DATABASE_URL: NO existe"; ok=0; fi
          if [ -n "$API_KEY" ]; then echo "OPENREPLY_API_KEY: existe (empieza por ${API_KEY:0:3}, ${#API_KEY} caracteres)"; else echo "OPENREPLY_API_KEY: NO existe"; ok=0; fi
          [ "$ok" = 1 ]

      - name: La llave abre OpenReply
        env:
          API_KEY: ${{ secrets.OPENREPLY_API_KEY }}
          OPENREPLY_URL: https://openreply.dgdesignmodeling.com
        run: |
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -H "Authorization: Bearer $API_KEY" \
            "$OPENREPLY_URL/api/workspace/api-keys")
          echo "HTTP $code"
          case "$code" in
            200)
              python3 - <<'PY'
          import json
          d = json.load(open("/tmp/resp.json"))
          keys = d.get("data", {}).get("keys", [])
          print(f"OpenReply acepta la llave. Llaves activas en el workspace: {len(keys)}")
          for k in keys:
              print(f"  - {k['name']} ({k['prefix']}…) creada {k['createdAt'][:10]} por {k['createdBy']['email']}")
          PY
              ;;
            401) echo "OpenReply rechaza la llave (revocada, mal copiada, o el despliegue aún no tiene el endpoint)"; exit 1 ;;
            *)   echo "Respuesta inesperada:"; head -c 400 /tmp/resp.json; echo; exit 1 ;;
          esac

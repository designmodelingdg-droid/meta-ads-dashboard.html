<!-- ============================================================
     guia-revit-ia · para la LECCIÓN del producto en GoHighLevel
     GENERADO AUTOMÁTICAMENTE — no editar a mano.
     Se regenera con: python3 scripts/build_ghl_landing.py guia-revit-ia
     Pegar con el botón <> (código fuente) de la descripción
     de la lección. No hace falta ningún botón: la guía se lee
     dentro de la lección.
     ============================================================ -->
<iframe id="dma-guia" src="https://designmodelingdg-droid.github.io/meta-ads-dashboard.html/guia-revit-ia/guia.html?acceso=dm2026"
        style="width:100%;height:17200px;border:0;display:block"
        loading="lazy" title="Guía"></iframe>
<script>
/* La guía avisa de cuánto mide y el marco se ajusta: sin esto queda
   una segunda barra de scroll dentro de la lección. Si GHL borra este
   script, el marco se queda en 17200 px y se lee igual. */
addEventListener('message', function (e) {
  if (!e.data || e.data.dma !== 'alto') return;
  var f = document.getElementById('dma-guia');
  if (f) f.style.height = (e.data.alto + 40) + 'px';
});
</script>
